# Per-crate instrumented baseline for the WordCraft fork. Never publishes or pushes upstream.
name: Fork document coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-doc-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Instrument document model, binary import, and control-key
        run: cargo llvm-cov --locked -p wordcraft-doc -p wordcraft-docbin -p wordcraft-control-key --lcov --output-path coverage-core.lcov
      - name: Produce auditable per-crate line and function counts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          crates = ("doc", "docbin", "control-key")
          totals = {c: {"files": 0, "lines_found": 0, "lines_hit": 0, "functions_found": 0, "functions_hit": 0} for c in crates}
          current = None
          for line in Path("coverage-core.lcov").read_text().splitlines():
              if line.startswith("SF:"):
                  path = line[3:].replace("\\", "/")
                  current = next((c for c in crates if "/crates/" + c + "/" in "/" + path.lstrip("/")), None)
                  if current is not None:
                      totals[current]["files"] += 1
              elif current is not None:
                  for tag, field in [("LF:", "lines_found"), ("LH:", "lines_hit"), ("FNF:", "functions_found"), ("FNH:", "functions_hit")]:
                      if line.startswith(tag):
                          totals[current][field] += int(line[len(tag):])
                          break
              if line == "end_of_record":
                  current = None

          for name, count in totals.items():
              if not count["files"] or not count["lines_found"]:
                  raise SystemExit(f"Missing instrumented source coverage for {name}: {count}")
          Path("coverage-core-summary.json").write_text(json.dumps(totals, indent=2) + "\n")
          for name, count in totals.items():
              print(f"{name}: {count['lines_hit']}/{count['lines_found']} lines; {count['functions_hit']}/{count['functions_found']} functions")
          PY
      - name: Upload coverage evidence (including partial reports on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-core-codecs-lcov
          path: |
            coverage-core.lcov
            coverage-core-summary.json
          if-no-files-found: ignore
          retention-days: 30
