# Extended, fork-only validation. No publish/merge/upstream permissions.
name: Fork workspace validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Run all workspace unit and integration tests
        run: cargo test --locked --workspace
      - name: Collect exact harness test counts
        if: success()
        run: cargo xtask stats --exact | tee workspace-test-counts.txt
      - name: Publish exact test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-counts
          path: workspace-test-counts.txt
          if-no-files-found: ignore
          retention-days: 30

  workspace-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Full workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  repository-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - name: Verify crate layering
        run: cargo xtask layers
      - name: Verify attributed assets
        run: cargo xtask assets

  wasm-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-web
      - name: Check browser application and dependencies
        run: cargo check --locked --target wasm32-unknown-unknown -p wordcraft-web
