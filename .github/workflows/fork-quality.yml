# Isolated quality gates for the Rwanbt fork; no upstream writes or releases.
name: Fork quality foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --all -- --check

  core-regressions:
    name: Core regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Safe-save integration regressions
        run: cargo test --locked -p wordcraft-engine --test safe_save
      - name: DOCX hostile-input regressions
        run: cargo test --locked -p wordcraft-docx --test malformed

  linux-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - name: Run engine unit tests (including new save safety cases)
        run: cargo test --locked -p wordcraft-engine --lib
      - name: Run DOCBIN decoding unit regressions
        run: cargo test --locked -p wordcraft-docbin --lib
      - name: Lint critical crates
        run: cargo clippy --locked -p wordcraft-geom -p wordcraft-docx -p wordcraft-engine --all-targets -- -D warnings

  geom-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Baseline line coverage (geom crate only)
        run: cargo llvm-cov --locked -p wordcraft-geom --lcov --output-path coverage-geom.lcov
      - name: Upload reproducible geom coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-geom-linux
          path: coverage-geom.lcov
          if-no-files-found: ignore
          retention-days: 30
